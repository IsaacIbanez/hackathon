<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escáner — app de prueba (provisional)</title>
<style>
  :root { --fondo:#f4f5f7; --panel:#fff; --borde:#dfe2e7; --texto:#1d2129; --suave:#5b6472;
          --acento:#2457d6; --ok:#1a7f4b; --parcial:#b26a00; --error:#c2352b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--fondo); color:var(--texto); }
  header { padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--borde); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:18px; margin:0; }
  header span { color:var(--parcial); font-size:13px; font-weight:600; }
  main { display:grid; grid-template-columns: 420px 1fr; gap:16px; padding:16px; align-items:start; }
  section { background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:14px; }
  h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; font-size:13px; color:var(--suave); margin:8px 0 3px; }
  select, input[type=number] { width:100%; padding:6px 8px; border:1px solid var(--borde); border-radius:6px; font:inherit; }
  .fila { display:flex; gap:8px; } .fila > * { flex:1; }
  .checks { display:flex; gap:14px; margin-top:8px; font-size:13px; }
  .checks label { display:flex; gap:5px; align-items:center; margin:0; color:var(--texto); }
  button { padding:9px 12px; border-radius:7px; border:1px solid var(--borde); background:#fff; font:inherit; cursor:pointer; }
  button.principal { background:var(--acento); border-color:var(--acento); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .vista { margin-top:12px; aspect-ratio:16/9; background:#111; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#888; overflow:hidden; }
  .vista img { width:100%; height:100%; object-fit:contain; }
  .soltar { margin-top:12px; border:2px dashed var(--borde); border-radius:8px; padding:14px; text-align:center; color:var(--suave); font-size:13px; }
  .soltar.encima { border-color:var(--acento); color:var(--acento); }
  #estado { margin-top:12px; font-size:13px; color:var(--suave); min-height:20px; }
  .insignia { display:inline-block; padding:2px 9px; border-radius:20px; color:#fff; font-weight:600; font-size:13px; }
  .ok { background:var(--ok); } .parcial { background:var(--parcial); } .error { background:var(--error); }
  .datos { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap:8px 16px; margin:12px 0; font-size:13px; }
  .datos b { display:block; color:var(--suave); font-weight:500; font-size:12px; }
  .avisos { font-size:13px; color:var(--parcial); }
  .pestanas { display:flex; gap:4px; border-bottom:1px solid var(--borde); margin-top:8px; }
  .pestanas button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--suave); }
  .pestanas button.activa { border-bottom-color:var(--acento); color:var(--texto); font-weight:600; }
  .contenido { padding-top:12px; }
  iframe { width:100%; height:78vh; border:1px solid var(--borde); border-radius:6px; }
  .pagina { position:relative; display:inline-block; max-width:100%; }
  .pagina img { max-width:100%; max-height:78vh; display:block; border:1px solid var(--borde); }
  .caja { position:absolute; border:1px solid rgba(36,87,214,.55); background:rgba(36,87,214,.08); }
  .caja:hover { background:rgba(36,87,214,.25); }
  .caja.baja { border-color:rgba(194,53,43,.7); background:rgba(194,53,43,.1); }
  img.det { max-width:100%; max-height:78vh; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td, th { text-align:left; padding:5px 8px; border-bottom:1px solid var(--borde); vertical-align:top; }
  pre { font-size:12px; background:#f7f8fa; padding:10px; border-radius:6px; overflow:auto; max-height:78vh; }
  .vacio { color:var(--suave); padding:40px; text-align:center; }
</style>
</head>
<body>
<header><h1>Escáner: captura → PDF buscable</h1><span>APP PROVISIONAL DE PRUEBA</span></header>
<main>
  <section>
    <h2>Captura</h2>
    <label for="camara">Cámara</label>
    <select id="camara"></select>
    <div class="fila">
      <div><label for="calentamiento">Calentamiento (s)</label><input id="calentamiento" type="number" value="1.5" step="0.5" min="0"></div>
      <div><label for="modo">Modo</label><select id="modo"><option>color</option><option>gris</option><option value="bn">blanco y negro</option></select></div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="recortar" checked> Recortar hoja</label>
      <label><input type="checkbox" id="iluminacion" checked> Corregir luz</label>
    </div>
    <div class="vista" id="vista">Vista previa apagada</div>
    <div class="fila" style="margin-top:10px">
      <button id="btnVista">Encender vista previa</button>
      <button id="btnEscanear" class="principal">Escanear</button>
    </div>
    <div class="soltar" id="soltar">Arrastra aquí una imagen (PNG, o JPG del móvil)<br>o <a href="#" id="elegir">elige un archivo</a>
      <input type="file" id="archivo" accept="image/*" hidden></div>
    <div id="estado"></div>
  </section>

  <section id="resultado"><div class="vacio">Escanea o sube una imagen para ver el resultado.</div></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let vistaEncendida = false, ultimo = null, pestana = "pdf";

function opciones() {
  const p = new URLSearchParams({ modo: $("modo").value, recortar: $("recortar").checked ? "1" : "0",
                                  iluminacion: $("iluminacion").checked ? "1" : "0" });
  if ($("camara").value !== "") p.set("camara", $("camara").value);
  p.set("calentamiento", $("calentamiento").value || "1.5");
  return p;
}

async function cargarCamaras() {
  const r = await (await fetch("/api/camaras")).json();
  const sel = $("camara");
  sel.innerHTML = r.camaras.length ? "" : '<option value="">(sin nombres: se usará "brio")</option>';
  for (const c of r.camaras) sel.add(new Option(`${c.indice}: ${c.nombre}`, String(c.indice)));
  const brio = r.camaras.find(c => /brio/i.test(c.nombre));
  if (brio) sel.value = String(brio.indice);
}

async function encenderVista() {
  const r = await fetch("/api/vista/iniciar?" + opciones(), { method: "POST" });
  const d = await r.json();
  if (!r.ok) { estado(d.error_captura?.mensaje || "No se pudo abrir la cámara", true); return; }
  vistaEncendida = true;
  $("vista").innerHTML = `<img src="/vista.mjpg?t=${Date.now()}" alt="Vista previa de la cámara">`;
  $("btnVista").textContent = "Apagar vista previa";
}
async function apagarVista() {
  await fetch("/api/vista/parar", { method: "POST" });
  vistaEncendida = false;
  $("vista").textContent = "Vista previa apagada";
  $("btnVista").textContent = "Encender vista previa";
}

function estado(texto, error = false) { $("estado").innerHTML = error ? `<span style="color:var(--error)">${texto}</span>` : texto; }

async function trabajar(promesa, etiqueta) {
  $("btnEscanear").disabled = true;
  const t0 = performance.now();
  const reloj = setInterval(() => estado(`${etiqueta}… ${((performance.now() - t0) / 1000).toFixed(1)} s`), 100);
  try {
    const r = await promesa;
    const d = await r.json();
    clearInterval(reloj);
    if (d.error_captura) { estado("Error de captura: " + d.error_captura.mensaje, true); return; }
    if (d.error) { estado(d.error, true); return; }
    estado(`Listo en ${((performance.now() - t0) / 1000).toFixed(1)} s`);
    ultimo = d; pintar();
  } catch (e) { clearInterval(reloj); estado("Error: " + e, true); }
  finally { $("btnEscanear").disabled = false; }
}

async function escanear() {
  const volver = vistaEncendida;
  if (volver) { vistaEncendida = false; $("vista").textContent = "Capturando a resolución completa…"; }
  await trabajar(fetch("/api/escanear?" + opciones(), { method: "POST" }), "Capturando y generando el PDF");
  if (volver) encenderVista();
}

function subir(archivo) {
  if (!archivo) return;
  trabajar(fetch("/api/subir?" + opciones(), { method: "POST", body: archivo }), `Procesando ${archivo.name}`);
}

const f = (v, d = 2) => v == null ? "—" : (typeof v === "number" ? v.toFixed(d) : v);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function pintar() {
  const d = ultimo, r = d.resultado, cont = $("resultado");
  if (!r) { cont.innerHTML = '<div class="vacio">Sin resultado</div>'; return; }
  if (r.estado === "error") {
    cont.innerHTML = `<h2><span class="insignia error">error</span> ${esc(r.error.codigo)}</h2><p>${esc(r.error.mensaje)}</p>`;
    return;
  }
  const v = r.validacion || {}, p = r.pagina || {}, c = r.calidad || {}, o = r.ocr || {}, cap = d.captura || {};
  const res = cap.resolucion_entregada;
  cont.innerHTML = `
    <h2><span class="insignia ${r.estado}">${r.estado}</span> ${esc(r.pdf.split(/[\\/]/).pop())}</h2>
    <div class="datos">
      <div><b>Captura</b>${res ? `${res.ancho}×${res.alto} ${esc(cap.formato || "")} · ${esc(cap.camara?.nombre || "")}` : "imagen subida"}</div>
      <div><b>Página</b>${p.ancho_px}×${p.alto_px} px · ${p.papel || "sin papel estándar"} · ${f(p.dpi?.[0], 0)} DPI</div>
      <div><b>Hoja detectada</b>${r.deteccion ? (r.deteccion.encontrada ? `sí (confianza ${f(r.deteccion.confianza)})` : "no") : "—"}${p.giro_grados ? ` · girada ${p.giro_grados}°` : ""}</div>
      <div><b>Calidad</b>${f(c.puntuacion)} ${c.problemas?.length ? "· " + c.problemas.join(", ") : ""}</div>
      <div><b>OCR</b>${o.palabras ?? 0} palabras · confianza ${f(o.confianza_media)}</div>
      <div><b>Validación</b>${v.ok ? "correcta" : "con fallos"} · PSNR ${f(v.psnr_db, 1)} dB · desfase ${f(v.desfase_mediano, 4)}</div>
      <div><b>Tiempo</b>${f(r.tiempos_ms.total / 1000, 1)} s (OCR ${f((r.tiempos_ms.ocr || 0) / 1000, 1)} s)</div>
      <div><b>Medidas</b>nitidez ${f(c.medidas?.nitidez, 0)} · brillo ${f(c.medidas?.brillo_medio, 0)}</div>
    </div>
    ${r.avisos.length ? `<div class="avisos">Avisos: ${r.avisos.map(esc).join(", ")}</div>` : ""}
    <div class="pestanas">
      ${[["pdf", "PDF"], ["pagina", "Página + bloques"], ["deteccion", "Detección"], ["texto", "Texto"], ["json", "JSON"]]
        .map(([k, t]) => `<button data-p="${k}" class="${k === pestana ? "activa" : ""}">${t}</button>`).join("")}
    </div>
    <div class="contenido" id="contenido"></div>`;
  cont.querySelectorAll(".pestanas button").forEach(b => b.onclick = () => { pestana = b.dataset.p; pintar(); });
  pintarPestana();
}

function pintarPestana() {
  const d = ultimo, r = d.resultado, u = d.urls || {}, el = $("contenido");
  const bloques = d.documento?.blocks || [];
  if (pestana === "pdf") {
    el.innerHTML = `<iframe src="${u.pdf}#view=FitH" title="PDF generado"></iframe>
      <p style="font-size:13px;color:var(--suave)">Prueba Ctrl+F dentro del PDF para buscar texto, y a seleccionar y copiar.</p>`;
  } else if (pestana === "pagina") {
    if (!u.pagina) { el.innerHTML = '<div class="vacio">Sin página guardada</div>'; return; }
    el.innerHTML = `<div class="pagina"><img src="${u.pagina}" alt="Página corregida">${bloques.map(b =>
      `<div class="caja ${b.confidence < 0.6 ? "baja" : ""}" title="${esc(b.text)} (${f(b.confidence)})"
        style="left:${b.box.x * 100}%;top:${b.box.y * 100}%;width:${b.box.w * 100}%;height:${b.box.h * 100}%"></div>`).join("")}</div>
      <p style="font-size:13px;color:var(--suave)">Cajas del mensaje <code>document</code> (coordenadas normalizadas). En rojo, confianza &lt; 0,6. Pasa el ratón para ver el texto.</p>`;
  } else if (pestana === "deteccion") {
    el.innerHTML = u.deteccion ? `<img class="det" src="${u.deteccion}" alt="Detección de la hoja">
      <p style="font-size:13px;color:var(--suave)">Verde: hoja usada para recortar. Rojo: candidata descartada.</p>`
      : '<div class="vacio">No se encontró ninguna hoja candidata (se usó la imagen entera).</div>';
  } else if (pestana === "texto") {
    el.innerHTML = bloques.length ? `<table><tr><th>id</th><th>texto</th><th>confianza</th></tr>${bloques.map(b =>
      `<tr><td>${b.id}</td><td>${esc(b.text)}</td><td>${f(b.confidence)}</td></tr>`).join("")}</table>`
      : '<div class="vacio">Sin texto reconocido</div>';
  } else {
    el.innerHTML = `<pre>${esc(JSON.stringify(d, null, 2))}</pre>`;
  }
}

$("btnVista").onclick = () => vistaEncendida ? apagarVista() : encenderVista();
$("btnEscanear").onclick = escanear;
$("camara").onchange = () => { if (vistaEncendida) encenderVista(); };
$("elegir").onclick = (e) => { e.preventDefault(); $("archivo").click(); };
$("archivo").onchange = (e) => subir(e.target.files[0]);
const zona = $("soltar");
zona.ondragover = (e) => { e.preventDefault(); zona.classList.add("encima"); };
zona.ondragleave = () => zona.classList.remove("encima");
zona.ondrop = (e) => { e.preventDefault(); zona.classList.remove("encima"); subir(e.dataTransfer.files[0]); };
cargarCamaras();
</script>
</body>
</html>
