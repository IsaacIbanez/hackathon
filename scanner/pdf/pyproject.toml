[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner-pdf"
version = "0.1.0"
description = "PNG image of a paper document -> searchable PDF (faithful image + invisible OCR layer)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.1",
    "img2pdf>=0.5",
    "pikepdf>=9",
    "pdfminer.six>=20231228",
    "pytesseract>=0.3.10",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scanner-pdf = "scanner_pdf.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ocr: needs Tesseract installed"]
