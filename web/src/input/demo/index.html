<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba de gestos de mano</title>
    <style>
      :root { color-scheme: dark; --fondo: #111; --texto: #f5f5f5; --acento: #ffd400; }
      body { margin: 0; font: 18px/1.4 system-ui, sans-serif; background: var(--fondo); color: var(--texto); }
      main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 16px; padding: 16px; }
      @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
      /* align-self: start evita que la celda de la rejilla se estire más que el vídeo
         (eso deformaba el lienzo y el esqueleto salía desplazado hacia abajo). */
      .escena { position: relative; align-self: start; }
      video, canvas { width: 100%; display: block; transform: scaleX(-1); border-radius: 8px; }
      canvas { position: absolute; inset: 0; height: 100%; pointer-events: auto; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; }
      dt { opacity: 0.7; } dd { margin: 0; font-weight: 700; }
      #accion { font-size: 32px; color: var(--acento); min-height: 1.4em; }
      button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 2px solid var(--acento); background: none; color: var(--texto); cursor: pointer; }
      ol { padding-left: 20px; max-height: 40vh; overflow: auto; font-size: 15px; }
      .ayuda { font-size: 15px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <main>
      <div class="escena">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="lienzo"></canvas>
      </div>
      <section>
        <h1>Gestos de mano</h1>
        <p id="estado" role="status">Cargando el modelo…</p>
        <div id="accion" aria-live="assertive"></div>
        <dl>
          <dt>Pose (frame)</dt><dd id="pose">—</dd>
          <dt>Gesto estable</dt><dd id="gesto">—</dd>
          <dt>Puntero en doc.</dt><dd id="doc">—</dd>
          <dt>FPS</dt><dd id="fps">—</dd>
        </dl>
        <p>
          <button id="marcar">Marcar documento (4 clics)</button>
          <label><input type="checkbox" id="voz" /> Decir la acción en voz alta</label>
        </p>
        <p class="ayuda">
          👍 leer · ✋ quieta: pausar · ✌️ repetir · mano abierta deslizando: siguiente / anterior ·
          ☝️ señalar quieto ~1 s: explicar aquí
        </p>
        <ol id="registro" reversed></ol>
      </section>
    </main>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
