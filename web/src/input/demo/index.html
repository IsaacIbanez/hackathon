<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba de gestos de mano</title>
    <style>
      :root { color-scheme: dark; --fondo: #111; --panel: #1c1c1c; --texto: #f5f5f5; --suave: #aaa; --acento: #ffd400; --ok: #34c759; --mal: #ff453a; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 17px/1.4 system-ui, sans-serif; background: var(--fondo); color: var(--texto); }
      main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 16px; padding: 16px; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
      /* El lienzo dibuja el vídeo y el esqueleto juntos: así siempre coinciden, aunque la
         cámara cambie de resolución. El <video> solo sirve de fuente y queda oculto debajo. */
      .escena { position: relative; align-self: start; }
      canvas { display: block; width: 100%; height: auto; transform: scaleX(-1); border-radius: 8px; background: #000; }
      video { position: absolute; inset: 0; width: 100%; opacity: 0; pointer-events: none; }
      #modo { position: absolute; top: 12px; left: 12px; padding: 6px 12px; border-radius: 999px; font-weight: 700; background: #000c; }
      #modo.despierto { color: var(--ok); } #modo.dormido { color: var(--mal); }
      #accion { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 34px; font-weight: 800; color: var(--acento); background: #000c; padding: 4px 16px; border-radius: 8px; white-space: nowrap; }
      #accion:empty { display: none; }
      /* Menú: capa HTML fija sobre el vídeo (no se dibuja en el lienzo, así no se solapa). */
      /* Cada opción ocupa su tercio de pantalla: es justo la zona donde el puntero la elige. */
      #menu { position: absolute; inset: 0; display: grid; background: #0007; border-radius: 8px;
        grid-template: ". arriba ." 1fr "izquierda centro derecha" 1fr ". abajo ." 1fr / 1fr 1fr 1fr; }
      #menu[hidden] { display: none; }
      #menu .op { --p: 0; margin: 10px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; border-radius: 14px;
        font-size: clamp(16px, 2.2vw, 26px); font-weight: 800; background: #000d; border: 3px solid #fff4;
        background-image: linear-gradient(90deg, #ffd40066 calc(var(--p) * 100%), transparent 0); }
      #menu .op.activa { border-color: var(--acento); color: var(--acento); }
      #menu .op.elegida { background: var(--acento); color: #000; }
      #menu .centro { grid-area: centro; display: flex; align-items: center; justify-content: center; text-align: center; color: #ddd; font-size: clamp(13px, 1.6vw, 18px); }
      /* Puntero por encima del menú. */
      #cursor { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
        background: #ff3b30; border: 3px solid #fff; box-shadow: 0 0 0 3px #0008; pointer-events: none; }
      #cursor[hidden] { display: none; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      h2 { font-size: 16px; margin: 16px 0 6px; color: var(--suave); text-transform: uppercase; letter-spacing: .05em; }
      section > div { background: var(--panel); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
      dt { color: var(--suave); } dd { margin: 0; font-weight: 700; }
      label { display: block; margin: 4px 0; } label small { color: var(--suave); }
      select, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 2px solid var(--acento); background: none; color: var(--texto); cursor: pointer; }
      table { width: 100%; border-collapse: collapse; font-size: 15px; }
      td { padding: 3px 4px; border-bottom: 1px solid #333; vertical-align: top; }
      td:first-child { white-space: nowrap; }
      .exp { color: var(--acento); font-size: 12px; font-weight: 700; }
      #ajustes input { width: 100%; }
      ol { padding-left: 20px; max-height: 30vh; overflow: auto; font-size: 14px; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="escena">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="lienzo"></canvas>
        <div id="modo" hidden></div>
        <div id="accion" aria-live="assertive"></div>
        <div id="menu" hidden>
          <div class="op" data-s="arriba" style="grid-area: arriba"></div>
          <div class="op" data-s="izquierda" style="grid-area: izquierda"></div>
          <div class="centro">☝️ lleva el puntero<br />a una opción y mantén ~0,5 s</div>
          <div class="op" data-s="derecha" style="grid-area: derecha"></div>
          <div class="op" data-s="abajo" style="grid-area: abajo"></div>
        </div>
        <div id="cursor" hidden></div>
      </div>
      <section>
        <h1>Gestos de mano</h1>
        <p id="estado" role="status">Cargando el modelo…</p>

        <div>
          <dl>
            <dt>Pose (frame)</dt><dd id="pose">—</dd>
            <dt>Gesto estable</dt><dd id="gesto">—</dd>
            <dt>Puntero en doc.</dt><dd id="doc">—</dd>
            <dt>Volumen voz</dt><dd id="volumen">100 %</dd>
            <dt>Pulgar–índice</dt><dd id="separacion">—</dd>
            <dt>Alcance índice</dt><dd id="alcance">—</dd>
            <dt>Mano</dt><dd id="manoUsada">—</dd>
            <dt>FPS</dt><dd id="fps">—</dd>
          </dl>
        </div>

        <div>
          <label>Contexto
            <select id="contexto">
              <option value="documento">Leyendo un documento</option>
              <option value="formulario">Rellenando un formulario</option>
              <option value="pc">Usando el PC</option>
            </select>
          </label>
          <label><input type="checkbox" id="despertar" /> Modo dormido / despierto <span class="exp">EXP</span><br /><small>✋ mantenida ~1 s para despertar; se duerme tras 10 s sin gestos</small></label>
          <label><input type="checkbox" id="movilidad" /> Perfil movilidad reducida <span class="exp">EXP</span><br /><small>gestos más lentos y tolerantes al temblor</small></label>
          <label><input type="checkbox" id="cabeza" /> Gestos de cabeza <span class="exp">EXP</span><br /><small>asentir y negar (descarga otro modelo, ~4 MB)</small></label>
          <label><input type="checkbox" id="vozSel" /> Señalar + voz <span class="exp">EXP</span><br /><small id="vozInfo">al seleccionar señalando, escucha una pregunta</small></label>
          <label><input type="checkbox" id="invertirMano" /> La mano detectada sale al revés<br /><small>márcalo si «Mano» no coincide con la mano que usas</small></label>
          <label><input type="checkbox" id="voz" checked /> Decir la acción en voz alta<br /><small>con el volumen que marques con la pinza 🤏</small></label>
          <p><button id="marcar">Marcar documento (4 clics)</button> <button id="reiniciar">Reiniciar cámara</button> <button id="recalibrar">Calibrar volumen</button></p>
        </div>

        <h2>Ajustes de la pinza</h2>
        <div id="ajustes">
          <label>Medida que es 0 % (dedos juntos): <b data-v="nivelCero"></b><br /><small>para empezar hay que juntar los dedos por debajo de esta medida</small>
            <input type="range" data-k="nivelCero" min="0" max="0.8" step="0.05" /></label>
          <label>Medida que es 100 % (dedos abiertos): <b data-v="nivelLleno"></b><br /><small>más bajo = hay que abrir menos los dedos</small>
            <input type="range" data-k="nivelLleno" min="0.4" max="2" step="0.05" /></label>
          <label>Alcance del índice para empezar: <b data-v="indiceFuera"></b><br /><small>más bajo = empieza aunque el índice esté doblado (compara con «Alcance índice»)</small>
            <input type="range" data-k="indiceFuera" min="0.6" max="1.4" step="0.05" /></label>
          <label>Alcance del índice que cuenta como puño: <b data-v="indiceCerrado"></b><br /><small>por debajo, se termina el ajuste</small>
            <input type="range" data-k="indiceCerrado" min="0.5" max="1.2" step="0.05" /></label>
        </div>

        <h2>Chuleta del contexto actual</h2>
        <div><table id="chuleta"></table></div>

        <h2>Registro</h2>
        <div><ol id="registro" reversed></ol></div>
      </section>
    </main>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
