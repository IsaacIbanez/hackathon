<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camera Lab</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0d12; --surface: #141821; --border: #262d3c; --text: #e9edf5; --muted: #8e98ab; --accent: #ffd23f; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.5 system-ui, "Segoe UI", sans-serif; padding: 16px; }
      h1 { font-size: 1.6rem; margin: 0 0 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
      button { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 12px; border: 2px solid var(--accent); background: var(--surface); color: var(--text); cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      label, select, input { font: inherit; color: inherit; }
      select, input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
      figure { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px; }
      figcaption { color: var(--muted); font-size: 0.95rem; margin-top: 6px; overflow-wrap: anywhere; }
      video, img { width: 100%; display: block; border-radius: 8px; background: #000; }
      #log { color: var(--muted); white-space: pre-wrap; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>Camera Lab — openCamera / captureStill</h1>
    <div class="row">
      <button id="open">Open camera</button>
      <button id="still" disabled>Capture still</button>
      <label>Window <input id="duration" type="number" value="500" min="0" step="100" style="width: 6em" /> ms</label>
      <label>Format
        <select id="type"><option value="image/png">PNG (lossless)</option><option value="image/jpeg">JPEG 0.95</option></select>
      </label>
    </div>
    <p id="status" role="status" aria-live="polite">Press “Open camera”.</p>
    <div class="grid">
      <figure><video id="video" muted playsinline></video><figcaption id="videoInfo">—</figcaption></figure>
      <figure><img id="photo" alt="Last still" /><figcaption id="photoInfo">—</figcaption></figure>
    </div>
    <div id="log"></div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
