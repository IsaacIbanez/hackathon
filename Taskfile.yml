# Tareas del proyecto. Instala task una vez:
#   go install github.com/go-task/task/v3/cmd/task@latest
# Uso: task gen | task mock | task dev | task check
version: "3"

vars:
  # En Linux, Wails usa WebKitGTK 4.1 (Ubuntu 24.04+ / Debian 13): hace falta esta etiqueta.
  GOTAGS: '{{if eq OS "linux"}}-tags webkit2_41{{end}}'

tasks:
  gen:
    desc: Genera los tipos Go (api/gen) y TypeScript (web/src/api/types.ts) desde api/openapi.yaml
    sources:
      - api/openapi.yaml
      - api/oapi-codegen.yaml
    generates:
      - api/gen/types.gen.go
      - web/src/api/types.ts
    cmds:
      - go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
      - npx --yes openapi-typescript@7.13.0 api/openapi.yaml -o web/src/api/types.ts

  mock:
    desc: Arranca el servidor mock (sin Wails) en localhost:8080
    cmds:
      - go run ./backend/cmd/mock {{.CLI_ARGS}}

  dev:
    desc: Arranca la app de escritorio con recarga en caliente (wails dev)
    cmds:
      - wails dev {{.GOTAGS}}

  check:
    desc: build y lint del frontend, go vet y go test
    cmds:
      # Primero el front: main.go embebe web/dist y sin él Go no compila.
      - task: web-build
      - go vet {{.GOTAGS}} ./...
      - go test {{.GOTAGS}} ./...

  web-build:
    internal: true
    dir: web
    cmds:
      - npm ci
      - npm run lint
      - npm run build
