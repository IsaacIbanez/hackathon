openapi: 3.0.3
info:
  title: LauzHack project — backend <-> frontend contract
  version: 0.8.0
  description: |
    The only interface between modules. HTTP for health and WebSocket (`/ws`) for everything else.

    Every WebSocket message travels in a common envelope `{type, id, ts, payload}`:
    - `type`: message type (`document`, `pointer`, `utterance`, `speak`, `stats`).
    - `id`: unique message id (a UUID or any string unique within the session).
    - `ts`: timestamp in milliseconds since epoch (`Date.now()` in the browser).
    - `payload`: the content; its schema depends on `type`.

    Direction: the client (browser or a local process such as the scanner) sends `document`,
    `pointer` and `utterance` (ClientMessage); Go answers with `speak` and, after each model
    call, sends `stats` (ServerMessage). When Go accepts a `document` from any client, it also
    broadcasts that `document` to every WebSocket client, so the UI can show and highlight it
    even when the scanner sent it.

    The app has ONE shared session: a message from any client (WebSocket or POST /message)
    updates the same state, and every `speak` and `stats` is broadcast to all WebSocket clients.

    Coordinates: always normalized to [0, 1] relative to the cropped document image,
    origin at the top left.

    Security: the API only answers to Host 127.0.0.1 / localhost (no DNS rebinding) and to
    browser origins of the app (Vite, Wails); local processes send no Origin. POST /message
    only accepts application/json.

    Record any change here in the Decisions section of AGENTS.md.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Server liveness check
      responses:
        "200":
          description: The server is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /message:
    post:
      operationId: postMessage
      summary: Sends one client message without a WebSocket (for local processes such as the scanner)
      description: |
        The body is one envelope (ClientMessage). The answers are NOT returned here: they are
        broadcast to the WebSocket clients (the UI).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientMessage"
      responses:
        "202":
          description: Accepted; the answers go to the WebSocket clients
        "400":
          description: The body is not a contract envelope
        "413":
          description: Body larger than 4 MB
  /scan:
    post:
      operationId: postScan
      summary: Reads a document from a photo (the "lee el documento" command)
      description: |
        The body is the photo taken by the app's camera. Go answers 202 at once, says
        "un momento, estoy leyendo el documento", sends the photo to the reading service
        (role B2, SCANNER_URL, default http://127.0.0.1:8770/scan) and handles the returned
        document like any other: echo to the UI, explanation, highlights. Problems (no page
        found, service not running) are spoken to the user. Results go to the WebSocket clients.

        The reading service implements the same path: POST the photo → 200 with a
        DocumentPayload (with pageCorners), or 422 {"error": "..."} when there is no page.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: Accepted; results go to the WebSocket clients
        "400":
          description: Empty body
        "413":
          description: Photo larger than 40 MB
        "415":
          description: Not a JPEG, PNG or WebP image
  /transcribe:
    post:
      operationId: postTranscribe
      summary: Cloud backup of the voice recognizer (a WAV recording to text)
      description: |
        Used by the UI only when the on-device recognizer fails or returns nothing. Go sends
        the recording to an audio model (TranscribeModels, default Gemini 2.5 Flash Lite and a
        free backup); the cost goes to the meter and an updated `stats` is broadcast.
      parameters:
        - name: lang
          in: query
          required: false
          schema: { type: string, example: es-ES }
      requestBody:
        required: true
        content:
          audio/wav:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The transcription (empty text = nobody spoke)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
        "400":
          description: Empty recording
        "413":
          description: Recording larger than 10 MB
        "415":
          description: Not audio/wav
        "502":
          description: No audio model answered
  /captions:
    get:
      operationId: openCaptions
      summary: Live captions WebSocket (speech to text, speakers and translation)
      description: |
        Upgrade to WebSocket. Separate from `/ws`: it carries audio, not contract envelopes.
        Go relays the audio to a streaming speech-to-text service (Together AI realtime,
        `CAPTIONS_ASR_MODEL`), labels speakers with a batch diarization pass every ~15 s and
        once more over the whole recording when the client stops, and sends each final
        sentence to a small language model (`CAPTIONS_TRANSLATE_MODEL`) that finds its main
        language (people may speak different languages), wraps words from another language in
        double quotes (barbarisms such as "el \"meeting\"") and translates it. It saves the
        transcript as a `.txt` file outside the repository. The API key (`TOGETHER_API_KEY`)
        stays in Go.

        Client -> server:
        - binary frames: raw PCM, signed 16-bit little-endian, 16 kHz, mono (~100 ms each);
        - text frames: `CaptionsClientMessage` (`config` changes the target language live,
          `stop` ends the session: Go finishes the transcript, sends `saved` and closes).

        Server -> client: text frames with one `CaptionsEvent` each.

        The session stops by itself when its cost reaches `CAPTIONS_LIMIT_USD` (default 1 USD):
        `error` with code `limit_reached`, then `saved`.
      parameters:
        - name: lang
          in: query
          required: false
          description: Spoken language, ISO 639-1 (`es`, `en`...) or `auto` (default).
          schema: { type: string, example: auto }
        - name: target
          in: query
          required: false
          description: Translate final sentences to this ISO 639-1 language; `none` (default) = no translation.
          schema: { type: string, example: en }
        - name: speakers
          in: query
          required: false
          description: How many people talk, if known (1-10); it helps telling them apart. 0 or absent = unknown.
          schema: { type: integer, minimum: 0, maximum: 10, example: 2 }
      responses:
        "101":
          description: Switching protocols to WebSocket
  /ws:
    get:
      operationId: openWebSocket
      summary: Opens the session WebSocket
      description: |
        Upgrade to WebSocket. Each text frame is a JSON envelope:
        the client sends `ClientMessage` and the server answers with `ServerMessage`.
      responses:
        "101":
          description: Switching protocols to WebSocket
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Transcription:
      type: object
      required: [text, model, costUsd, latencyMs]
      properties:
        text: { type: string }
        model: { type: string }
        costUsd: { type: number, format: double }
        latencyMs: { type: integer, format: int64 }

    CaptionsClientMessage:
      description: Text frame from the client on `/captions`.
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [config, stop] }
        target:
          type: string
          description: "`config` only: new target language (ISO 639-1) or `none`."
          example: en

    CaptionsEvent:
      description: |
        Text frame from Go on `/captions`. Which fields are set depends on `type`:
        - `ready` {model, lang, target}: connected to the speech-to-text service.
        - `partial` {text}: the sentence being spoken; each one replaces the previous.
        - `final` {id, start, text, lang?}: a finished sentence; `start` = seconds since the
          session began; `lang` = its main language (ISO 639-1), when already known. Words from
          another language come in double quotes.
        - `revise` {id, text, lang}: a better text or language for sentence `id` (e.g. after
          learning who said it); replaces the previous one.
        - `speaker` {id, speaker}: who said sentence `id` ("Speaker 1"...). May arrive several
          times for the same `id` (live estimate first, whole-recording pass at the end).
        - `translation` {id, lang, text}: translation of sentence `id`.
        - `cost` {costUsd, limitUsd}: running cost of this session.
        - `saved` {path}: the transcript file was written (every minute and when stopping).
        - `error` {code, message, retryable}: `no_key`, `upstream`, `limit_reached`,
          `translation` and `diarization` (the last two are not fatal).
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [ready, partial, final, revise, speaker, translation, cost, saved, error]
        id: { type: string, example: s3 }
        text: { type: string }
        start: { type: number, format: double, example: 12.4 }
        speaker: { type: string, example: Speaker 1 }
        lang: { type: string, example: en }
        target: { type: string, example: en }
        model: { type: string }
        costUsd: { type: number, format: double }
        limitUsd: { type: number, format: double }
        path: { type: string }
        code:
          type: string
          enum: [no_key, upstream, limit_reached, translation, diarization]
        message: { type: string }
        retryable: { type: boolean }

    MessageType:
      type: string
      enum: [document, pointer, utterance, speak, stats]

    Envelope:
      description: Generic envelope. Used to read `type` before decoding `payload`.
      type: object
      required: [type, id, ts, payload]
      properties:
        type:
          $ref: "#/components/schemas/MessageType"
        id:
          type: string
        ts:
          type: integer
          format: int64
          description: Milliseconds since epoch
        payload:
          type: object
          # The generated code already imports encoding/json (because of the unions).
          x-go-type: json.RawMessage

    # ---------- Payloads ----------

    Box:
      description: Box normalized to [0, 1] (origin at the top left)
      type: object
      required: [x, y, w, h]
      properties:
        x: { type: number, format: float, minimum: 0, maximum: 1 }
        y: { type: number, format: float, minimum: 0, maximum: 1 }
        w: { type: number, format: float, minimum: 0, maximum: 1 }
        h: { type: number, format: float, minimum: 0, maximum: 1 }

    Point:
      description: Point normalized to [0, 1] over an image (origin at the top left)
      type: object
      required: [x, y]
      properties:
        x: { type: number, format: float }
        y: { type: number, format: float }

    TextBlock:
      type: object
      required: [id, text, box, confidence]
      properties:
        id:
          type: string
          description: Stable within the document; used by pointer and speak
        text:
          type: string
        box:
          $ref: "#/components/schemas/Box"
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Local OCR confidence

    FrameIssue:
      type: string
      enum: [blurry, dark, glare, cropped, tilted, too_far]

    FrameQuality:
      description: Quality of the document framing
      type: object
      required: [score, issues]
      properties:
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 1 = perfect
        issues:
          type: array
          items:
            $ref: "#/components/schemas/FrameIssue"

    DocumentPayload:
      type: object
      required: [blocks, quality]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/TextBlock"
        quality:
          $ref: "#/components/schemas/FrameQuality"
        imageWidth:
          type: integer
          description: Width in pixels of the cropped image (optional)
        imageHeight:
          type: integer
          description: Height in pixels of the cropped image (optional)
        lang:
          type: string
          description: Detected language (BCP-47), if known
          example: es
        pageCorners:
          description: |
            Corners of the page in the CAMERA PHOTO it was read from, normalized to [0, 1]
            over that photo: top-left, top-right, bottom-right, bottom-left (of the page as read,
            after orientation). Lets the pointer map the fingertip onto the real page. Optional:
            absent when the page was not detected (the whole photo was used).
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/Point"

    PointerPayload:
      type: object
      required: [x, y]
      properties:
        x: { type: number, format: float, minimum: 0, maximum: 1 }
        y: { type: number, format: float, minimum: 0, maximum: 1 }
        blockId:
          type: string
          description: Pointed block, if the finger falls inside one

    UtterancePayload:
      type: object
      required: [text, isFinal]
      properties:
        text:
          type: string
        isFinal:
          type: boolean
          description: false for partial speech recognition results
        lang:
          type: string
          example: es-ES

    SpeakPayload:
      type: object
      required: [text, highlightBlockIds, lang]
      properties:
        text:
          type: string
          description: Text to read aloud and display
        highlightBlockIds:
          type: array
          items:
            type: string
          description: TextBlock ids to highlight while speaking
        lang:
          type: string
          description: Voice language (BCP-47)
          example: es-ES
        replyTo:
          type: string
          description: id of the message this answers, if any

    TierStats:
      description: Accumulated usage of one model tier since the app started
      type: object
      required: [calls, cacheHits, errors, costUsd, avgLatencyMs, lastLatencyMs]
      properties:
        calls: { type: integer, description: Real model calls }
        cacheHits: { type: integer, description: Answers served from the cache (cost 0) }
        errors: { type: integer }
        costUsd: { type: number, format: double }
        avgLatencyMs: { type: integer, format: int64 }
        lastLatencyMs: { type: integer, format: int64 }

    StatsPayload:
      description: Cost and latency meter (AXA frugality criterion)
      type: object
      required: [cheap, expensive, totalCostUsd]
      properties:
        cheap: { $ref: "#/components/schemas/TierStats" }
        expensive: { $ref: "#/components/schemas/TierStats" }
        totalCostUsd: { type: number, format: double }

    # ---------- Typed messages (envelope + payload) ----------

    DocumentMessage:
      type: object
      required: [type, id, ts, payload]
      properties:
        type: { type: string, enum: [document] }
        id: { type: string }
        ts: { type: integer, format: int64 }
        payload: { $ref: "#/components/schemas/DocumentPayload" }

    PointerMessage:
      type: object
      required: [type, id, ts, payload]
      properties:
        type: { type: string, enum: [pointer] }
        id: { type: string }
        ts: { type: integer, format: int64 }
        payload: { $ref: "#/components/schemas/PointerPayload" }

    UtteranceMessage:
      type: object
      required: [type, id, ts, payload]
      properties:
        type: { type: string, enum: [utterance] }
        id: { type: string }
        ts: { type: integer, format: int64 }
        payload: { $ref: "#/components/schemas/UtterancePayload" }

    SpeakMessage:
      type: object
      required: [type, id, ts, payload]
      properties:
        type: { type: string, enum: [speak] }
        id: { type: string }
        ts: { type: integer, format: int64 }
        payload: { $ref: "#/components/schemas/SpeakPayload" }

    StatsMessage:
      type: object
      required: [type, id, ts, payload]
      properties:
        type: { type: string, enum: [stats] }
        id: { type: string }
        ts: { type: integer, format: int64 }
        payload: { $ref: "#/components/schemas/StatsPayload" }

    ClientMessage:
      description: What the client (browser or local process) sends to Go
      oneOf:
        - $ref: "#/components/schemas/DocumentMessage"
        - $ref: "#/components/schemas/PointerMessage"
        - $ref: "#/components/schemas/UtteranceMessage"
      discriminator:
        propertyName: type
        mapping:
          document: "#/components/schemas/DocumentMessage"
          pointer: "#/components/schemas/PointerMessage"
          utterance: "#/components/schemas/UtteranceMessage"

    ServerMessage:
      description: What Go sends to the client (document = the current document, echoed to every client)
      oneOf:
        - $ref: "#/components/schemas/SpeakMessage"
        - $ref: "#/components/schemas/StatsMessage"
        - $ref: "#/components/schemas/DocumentMessage"
      discriminator:
        propertyName: type
        mapping:
          speak: "#/components/schemas/SpeakMessage"
          stats: "#/components/schemas/StatsMessage"
          document: "#/components/schemas/DocumentMessage"
